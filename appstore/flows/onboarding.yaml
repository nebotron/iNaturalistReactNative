# Takes a freshly installed app through first-run onboarding to the tab bar,
# skipping sign-up. Handles both onboardings: the carousel, and the step flow
# behind the OnboardingV2Enabled flag. Location is granted with simctl
# beforehand.
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
# Waits on text: React Native exposes a testID to Maestro only on elements
# that are accessible, which the carousel's container and the tab bar aren't
- extendedWaitUntil:
    visible: DISCOVER NATURE AROUND YOU
    timeout: 60000
    optional: true

# Carousel: its close button resets to the tabs with Login on top, whose own
# close button dismisses it. Tapped until the carousel goes: on a cold start
# the first tap can land before the app responds to it
- runFlow:
    when:
      visible: DISCOVER NATURE AROUND YOU
    commands:
      - waitForAnimationToEnd
      - repeat:
          while:
            visible: DISCOVER NATURE AROUND YOU
          times: 5
          commands:
            - tapOn: Close
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: Close
          timeout: 15000
          optional: true
      - tapOn:
          text: Close
          optional: true

# Step flow: skip the demo and sign-up through their exit sheets
- runFlow:
    when:
      visible:
        id: Onboarding.welcome.next
    commands:
      - tapOn:
          id: Onboarding.welcome.next
      - extendedWaitUntil:
          visible:
            id: Onboarding.obs_story.close
          timeout: 30000
      - tapOn:
          id: Onboarding.obs_story.close
      - tapOn: YES, EXIT
      - extendedWaitUntil:
          visible:
            id: Onboarding.signup_email.close
          timeout: 30000
      - tapOn:
          id: Onboarding.signup_email.close
      - tapOn: EXIT
      - extendedWaitUntil:
          visible:
            id: Onboarding.location_explainer.next
          timeout: 30000
      - tapOn:
          id: Onboarding.location_explainer.next

- runFlow:
    when:
      visible: Allow While Using App
    commands:
      - tapOn: Allow While Using App
- extendedWaitUntil:
    visible: Explore
    timeout: 30000
