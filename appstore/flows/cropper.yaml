# Imports the library photo into a new observation, which opens the cropper,
# then zooms in a little and turns the exposure down before the shot
appId: ${APP_ID}
---
- runFlow: start.yaml
# From Explore: the empty Me tab has a second, larger add-obs-button with no
# long press, and Maestro picks that one
- tapOn: Explore
- waitForAnimationToEnd
# A tap opens the camera; a long press offers the other ways to add one
- longPressOn:
    id: add-obs-button
# The sheet animates in; a second long press if the first didn't open it
- extendedWaitUntil:
    visible: Photo importer
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: Photo importer
    commands:
      - longPressOn:
          id: add-obs-button
      - extendedWaitUntil:
          visible: Photo importer
          timeout: 10000
- tapOn: Photo importer
- extendedWaitUntil:
    visible:
      id: PhotoGallery.done
    timeout: 30000
# The one photo in the library; the other PhotoGallery.* ids are controls
- tapOn:
    id: "PhotoGallery\\.(?!section|imported|hideImported|delete|markAsSaved|done|fillingIndicator|importingOverlay).+"
    index: 0
- tapOn:
    id: PhotoGallery.done
# The crop view itself isn't exposed to Maestro; its sliders are
- extendedWaitUntil:
    visible: Adjust brightness
    timeout: 60000
- swipe:
    from: Adjust zoom
    direction: RIGHT
    duration: 1500
- swipe:
    from: Adjust brightness
    direction: LEFT
    duration: 1500
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${SHOT}
