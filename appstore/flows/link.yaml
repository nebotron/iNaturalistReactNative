# Opens LINK in a freshly started app, optionally taps TAP_TEXT, waits for
# WAIT_ID (if given) and for the screen to settle, then saves SHOT.png
appId: ${APP_ID}
---
- runFlow: start.yaml
- openLink: ${LINK}
# iOS asks before a link opens an app
- extendedWaitUntil:
    visible: Open
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- runFlow:
    when:
      true: ${TAP_TEXT != ''}
    commands:
      - extendedWaitUntil:
          visible: ${TAP_TEXT}
          timeout: 30000
      - tapOn: ${TAP_TEXT}
- runFlow:
    when:
      true: ${WAIT_ID != ''}
    commands:
      # Optional, so a screen whose marker isn't exposed is still shot for review
      - extendedWaitUntil:
          visible:
            id: ${WAIT_ID}
          timeout: 60000
          optional: true
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: ${SHOT}
