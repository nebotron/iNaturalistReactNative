##
# The TestFlight build itself, called by testflight-ios.yml once per runner
# image it tries. See that file for the secrets it needs.
##
name: TestFlight iOS build
on:
  workflow_call:
    inputs:
      runner:
        description: macOS runner image to build on.
        type: string
        required: true
    outputs:
      started:
        description: '"true" once a runner picked the job up.'
        value: ${{ jobs.testflight.outputs.started }}

jobs:
  testflight:
    runs-on: ${{ inputs.runner }}
    # Kill the task if not finished after 120 minutes. An Intel runner's
    # archive takes ~80-90 minutes without a warm ccache, so give it longer.
    timeout-minutes: ${{ contains( inputs.runner, 'intel' ) && 180 || 120 }}
    env:
      TEAM_ID: DVURLJZFH6
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ARCHIVE_PATH: ${{ github.workspace }}/ios/build/iNaturalistReactNative.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/ios/build/export
      # Makes react_native_post_install wire every target's CC/CXX/LD through
      # react-native/scripts/xcode/ccache-clang.sh
      USE_CCACHE: '1'
    outputs:
      started: ${{ steps.start.outputs.started }}

    steps:
    # Intel runners keep their own caches: node_modules and Pods hold
    # host-arch binaries, and ccache misses on a different compiler binary.
    # "macOSX64" doesn't share the "macOS-" prefix the Arm restore-keys use.
    # Also tells testflight-ios.yml a runner was acquired, so it doesn't retry
    # a build that failed on its own merits.
    - name: Name the cache namespace for this runner
      id: start
      run: |
        echo "started=true" >> "$GITHUB_OUTPUT"
        echo "CACHE_OS=${{ runner.arch == 'X64' && 'macOSX64' || runner.os }}" >> "$GITHUB_ENV"

    # Fail in seconds rather than an hour into the build
    - name: Check that every secret is present
      env:
        ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
        GOOGLE_SERVICE_INFO_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PRODUCTION_BASE64 }}
      run: |
        missing=""
        for secret in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64 DOTENV_BASE64 \
          GOOGLE_SERVICE_INFO_PRODUCTION_BASE64; do
          [ -n "${!secret}" ] || missing="$missing $secret"
        done
        if [ -n "$missing" ]; then
          echo "Missing repository secrets:$missing" >&2
          exit 1
        fi

    - name: Check out Git repository
      uses: actions/checkout@v6

    - name: Install Node.js and NPM
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'

    # Upstream's Gemfile.lock lists Arm macOS and Linux only, and Bundler
    # refuses to install on any other platform. Uses the image's own Ruby.
    - name: Add Intel macOS to Gemfile.lock
      if: runner.arch == 'X64'
      run: bundle lock --add-platform x86_64-darwin

    - name: Setup Ruby version according to .ruby-version with cached gems
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    # Required workaround for Firebase & XCode >26.0.1
    # https://github.com/actions/runner-images/issues/13135#issuecomment-3397914993
    - name: Set Xcode Toolchain
      run: echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> "$GITHUB_ENV"

    # node_modules and the installed Pods tree in one cache, so an unchanged
    # set of lockfiles skips npm ci and patch-package entirely. node_modules is
    # cached after postinstall, so the patches are already applied. No
    # restore-keys: an installed Pods tree is only reusable for the exact
    # lockfile that produced it, and pod install still runs on top of it.
    - name: Restore node_modules and the installed Pods
      id: deps
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          ios/Pods
        key: deps-${{ env.CACHE_OS }}-${{ hashFiles( '.nvmrc', 'package-lock.json', 'patches/**', 'ios/Podfile.lock' ) }}

    - name: Install Dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      run: npm ci

    - name: Create .env file
      env:
        DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
      run: |
        printf '%s' "$DOTENV_BASE64" | base64 --decode > .env
        # DOTENV_BASE64 predates the per-platform OAuth rename
        sed -i '' -e 's/\r$//' -e 's/^OAUTH_CLIENT_/IOS_OAUTH_CLIENT_/' .env
        missing=""
        for key in API_URL OAUTH_API_URL JWT_ANONYMOUS_API_SECRET \
          IOS_OAUTH_CLIENT_ID IOS_OAUTH_CLIENT_SECRET \
          IOS_MODEL_FILE_NAME IOS_TAXONOMY_FILE_NAME IOS_GEOMODEL_FILE_NAME \
          CV_MODEL_VERSION GOOGLE_WEB_CLIENT_ID GOOGLE_IOS_CLIENT_ID CROP_LOG_FIREBASE_URL; do
          grep -qE "^${key}=.+" .env || missing="$missing $key"
        done
        if [ -n "$missing" ]; then
          echo "::error::.env from DOTENV_BASE64 is missing or empty:$missing"
          exit 1
        fi

    - name: Create GoogleService-Info.production.plist
      env:
        GOOGLE_SERVICE_INFO_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PRODUCTION_BASE64 }}
      run: |
        printf '%s' "$GOOGLE_SERVICE_INFO_PRODUCTION_BASE64" | base64 --decode \
          > ios/GoogleService-Info.production.plist

    # The CV model, geomodel and taxonomy aren't in the repo. Requires .env
    - name: Download the cv model and taxonomy file into the ios folder
      run: npm run add-example-model

    # Half the archive's ~1900 compiles are React Native core and its C++
    # dependencies, which change only when react-native does. ccache turns
    # those into cache hits across runs. Installs ccache's own universal
    # binary rather than brewing it and four dependencies (~20s).
    - name: Install ccache
      run: |
        CCACHE_VERSION=4.14.2
        curl -fsSL --retry 3 \
          "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-darwin.tar.gz" \
          | tar xz -C "$RUNNER_TEMP"
        mkdir -p "$HOME/.local/bin"
        mv "$RUNNER_TEMP/ccache-$CCACHE_VERSION-darwin/ccache" "$HOME/.local/bin/ccache"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        ccache --version | head -1
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
        # Xcode exports build settings to script phases but not to CompileC,
        # so the wrapper's $CCACHE_BINARY is empty there and it runs plain
        # clang, bypassing ccache. Bake the binary and cache dir into it.
        sed -i '' "s|^exec \$CCACHE_BINARY|exec env CCACHE_DIR=$HOME/.ccache CCACHE_MAXSIZE=2G $( command -v ccache )|" \
          node_modules/react-native/scripts/xcode/ccache-clang.sh
        cat node_modules/react-native/scripts/xcode/ccache-clang.sh

    # The ccache, and Metro's transform cache, read by metro.config.js through
    # METRO_CACHE_DIR so the bundle phase only re-transforms changed files.
    # Saved under a new key every run so the caches keep up with the code; the
    # restore-keys fall back to the newest one built against the same
    # dependencies. react-native-xcode.sh always bundles with --reset-cache,
    # which would wipe the Metro cache, so the next step drops the flag.
    # Worklets bundle mode writes each worklet to its own module under
    # .worklets as a side effect of transforming the file that holds it, so a
    # cached transform needs those modules kept alongside it.
    - name: Restore the ccache and Metro cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          ~/.metro-cache
          node_modules/react-native-worklets/.worklets
        key: build-${{ env.CACHE_OS }}-${{ hashFiles( 'ios/Podfile.lock', 'package-lock.json' ) }}-${{ github.run_id }}
        restore-keys: |
          build-${{ env.CACHE_OS }}-${{ hashFiles( 'ios/Podfile.lock', 'package-lock.json' ) }}-
          build-${{ env.CACHE_OS }}-

    - name: Stop the bundle phase resetting the Metro cache
      run: |
        sed -i '' '/^  --reset-cache \\$/d' node_modules/react-native/scripts/react-native-xcode.sh
        ! grep -q -- --reset-cache node_modules/react-native/scripts/react-native-xcode.sh

    # Downloaded pod tarballs — Firebase, GoogleSignIn, onnxruntime — are the
    # slow part of a cold pod install and are safe to reuse whatever the
    # lockfile says, since each is stored under its own version.
    - name: Restore the CocoaPods download cache
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/CocoaPods
        key: cocoapods-downloads-${{ runner.os }}-${{ hashFiles( 'ios/Podfile.lock' ) }}
        restore-keys: |
          cocoapods-downloads-${{ runner.os }}-

    # RCT_USE_RN_DEP and RCT_USE_PREBUILT_RNCORE make the React Native podspecs
    # vend headers only and link Meta's published XCFrameworks instead. Both
    # check Maven for the artifacts first and fall back to building from source
    # if they are missing, so neither can fail the install on its own.
    #
    # RCT_SYMBOLICATE_PREBUILT_FRAMEWORKS pulls the matching dSYMs. It is worth
    # its ~350MB because without it every React Native frame in a TestFlight
    # crash report arrives unsymbolicated.
    #
    # Note that pod install rewrites Podfile.lock under these — the prebuilt
    # pods replace RCT-Folly, boost, glog and fmt — which is why the cache key
    # for the installed Pods has to know which mode produced the tree.
    - name: Update Pods
      run: |
        cd ios && pod install

    # altool and xcodebuild both look for the key in ~/.appstoreconnect
    - name: Install the App Store Connect API key
      env:
        ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
      run: |
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        printf '%s' "$ASC_KEY_BASE64" | base64 --decode \
          > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

    # Archive reports a rejected key the same way whether Apple refuses the
    # key or refuses a signing change it asks for, so ask App Store Connect
    # directly what it thinks of the key and the App IDs' capabilities.
    - name: Check the API key and App IDs with App Store Connect
      continue-on-error: true
      run: |
        ruby .github/scripts/asc_diagnose.rb \
          "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" \
          com.benhannel.inat.dev com.benhannel.inat.dev.ShareExtensionIOS

    # A throwaway keychain holding the reusable certificates, which xcodebuild
    # then finds instead of creating new ones.
    - name: Import the signing certificate
      env:
        DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
        DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      run: |
        if [ -z "$DIST_CERT_P12_BASE64" ]; then
          echo "::warning::No DIST_CERT_P12_BASE64 secret; xcodebuild will create a new certificate"
          exit 0
        fi
        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PASSWORD="$( uuidgen )"
        printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security list-keychains -d user -s "$KEYCHAIN" $( security list-keychains -d user | tr -d '"' )
        rm "$RUNNER_TEMP/dist.p12"

    # CFBundleVersion is a literal in the app's Info.plist but is generated from
    # CURRENT_PROJECT_VERSION for the share extension, so both need setting. A
    # UTC timestamp is unique and always increasing, so no bump gets committed.
    - name: Set the build number
      run: |
        BUILD_NUMBER="$( date -u +%Y.%m%d.%H%M%S )"
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" \
          ios/iNaturalistReactNative/Info.plist

    # -allowProvisioningUpdates lets xcodebuild create App Store profiles (and,
    # without the reusable certificate, certificates) with the API key.
    #
    # COMPILER_INDEX_STORE_ENABLE=NO drops the index-while-building work, which
    # only feeds Xcode's editor; nothing opens this archive in an editor.
    - name: Archive
      run: |
        set -o pipefail
        ccache --zero-stats
        xcodebuild archive \
          -workspace ios/iNaturalistReactNative.xcworkspace \
          -scheme iNaturalistReactNative \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath "$ARCHIVE_PATH" \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
          COMPILER_INDEX_STORE_ENABLE=NO \
          METRO_CACHE_DIR="$HOME/.metro-cache" \
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
        {
          echo '### ccache'
          echo '```'
          ccache --show-stats --verbose
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"

    # MetricKit's CPU and disk-write exception stacks give the app's own frames
    # as offsets into the stripped binary. The dSYM's function table, demangled
    # and gzipped, is a few MB rather than the dSYM's hundreds, and is all
    # scripts/power_report.py --symbols needs to name them. Never fails the
    # upload: a build without it is only harder to profile.
    - name: Save the symbol table for MetricKit stacks
      continue-on-error: true
      run: |
        set -o pipefail
        DWARF="$ARCHIVE_PATH/dSYMs/iNaturalistReactNative.app.dSYM/Contents/Resources/DWARF/iNaturalistReactNative"
        mkdir -p "$RUNNER_TEMP/symbols"
        xcrun nm -n -U "$DWARF" | c++filt | xcrun swift-demangle --simplified \
          | gzip -9 > "$RUNNER_TEMP/symbols/$BUILD_NUMBER.txt.gz"
    - name: Upload the symbol table
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: symbols-${{ env.BUILD_NUMBER }}
        path: ${{ runner.temp }}/symbols/${{ env.BUILD_NUMBER }}.txt.gz
        retention-days: 90

    # destination=upload has the export sign the IPA and send it to App Store
    # Connect itself, saving the separate altool upload's repackaging pass.
    # uploadSymbols is off to keep the upload small, so TestFlight crash
    # reports arrive unsymbolicated.
    - name: Export and upload to TestFlight
      run: |
        cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>destination</key>
          <string>upload</string>
          <key>teamID</key>
          <string>$TEAM_ID</string>
          <key>signingStyle</key>
          <string>automatic</string>
          <key>uploadSymbols</key>
          <false/>
          <key>manageAppVersionAndBuildNumber</key>
          <false/>
        </dict>
        </plist>
        PLIST
        xcodebuild -exportArchive \
          -archivePath "$ARCHIVE_PATH" \
          -exportPath "$EXPORT_PATH" \
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
        echo "Uploaded build $BUILD_NUMBER to TestFlight" >> "$GITHUB_STEP_SUMMARY"
