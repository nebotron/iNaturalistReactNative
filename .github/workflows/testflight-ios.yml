##
# Build the iOS app on a GitHub runner and upload it to TestFlight, so builds
# can reach a phone without a local Mac.
#
# Fork-only: signs with Ben's own Apple team and the com.benhannel.inat.dev
# bundle IDs, so it never touches iNaturalist's App Store Connect records.
# Trigger from the Actions tab or with `gh workflow run testflight-ios.yml`.
#
# Required repository secrets:
#   ASC_KEY_ID     App Store Connect API key ID
#   ASC_ISSUER_ID  App Store Connect API issuer ID
#   ASC_KEY_BASE64 base64 of the AuthKey_<ASC_KEY_ID>.p8 private key
#   DOTENV_BASE64  base64 of the production .env
#   GOOGLE_SERVICE_INFO_PRODUCTION_BASE64
#                  base64 of ios/GoogleService-Info.production.plist
##
name: TestFlight iOS
on:
  workflow_dispatch:

concurrency:
  group: testflight-ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    # Kill the task if not finished after 120 minutes
    timeout-minutes: 120
    env:
      TEAM_ID: DVURLJZFH6
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ARCHIVE_PATH: ${{ github.workspace }}/ios/build/iNaturalistReactNative.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/ios/build/export
      # Makes react_native_post_install wire every target's CC/CXX/LD through
      # react-native/scripts/xcode/ccache-clang.sh
      USE_CCACHE: '1'

    steps:
    # Fail in seconds rather than an hour into the build
    - name: Check that every secret is present
      env:
        ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
        GOOGLE_SERVICE_INFO_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PRODUCTION_BASE64 }}
      run: |
        missing=""
        for secret in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64 DOTENV_BASE64 \
          GOOGLE_SERVICE_INFO_PRODUCTION_BASE64; do
          [ -n "${!secret}" ] || missing="$missing $secret"
        done
        if [ -n "$missing" ]; then
          echo "Missing repository secrets:$missing" >&2
          exit 1
        fi

    - name: Check out Git repository
      uses: actions/checkout@v6

    - name: Install Node.js and NPM
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Setup Ruby version according to .ruby-version with cached gems
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    # Required workaround for Firebase & XCode >26.0.1
    # https://github.com/actions/runner-images/issues/13135#issuecomment-3397914993
    - name: Set Xcode Toolchain
      run: echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> "$GITHUB_ENV"

    # node_modules itself, not just the npm download cache, so an unchanged
    # lockfile skips the install and the patch-package run entirely. Cached
    # after postinstall, so the patches are already applied.
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles( '.nvmrc', 'package-lock.json', 'patches/**' ) }}

    - name: Install Dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      run: npm ci

    - name: Create .env file
      env:
        DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
      run: printf '%s' "$DOTENV_BASE64" | base64 --decode > .env

    - name: Create GoogleService-Info.production.plist
      env:
        GOOGLE_SERVICE_INFO_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PRODUCTION_BASE64 }}
      run: |
        printf '%s' "$GOOGLE_SERVICE_INFO_PRODUCTION_BASE64" | base64 --decode \
          > ios/GoogleService-Info.production.plist

    # The CV model, geomodel and taxonomy aren't in the repo. Requires .env
    - name: Download the cv model and taxonomy file into the ios folder
      run: npm run add-example-model

    # Half the archive's ~1900 compiles are React Native core and its C++
    # dependencies, which change only when react-native does. ccache turns
    # those into cache hits across runs.
    - name: Install ccache
      run: |
        command -v ccache >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"

    # Saved under a new key every run so the cache keeps up with the code; the
    # restore-keys fall back to the newest cache built against the same Pods.
    - name: Restore the ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles( 'ios/Podfile.lock' ) }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ hashFiles( 'ios/Podfile.lock' ) }}-
          ccache-${{ runner.os }}-

    # Downloaded pod tarballs — Firebase, GoogleSignIn, onnxruntime — are the
    # slow part of a cold pod install and are safe to reuse whatever the
    # lockfile says, since each is stored under its own version.
    - name: Restore the CocoaPods download cache
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/CocoaPods
        key: cocoapods-downloads-${{ runner.os }}-${{ hashFiles( 'ios/Podfile.lock' ) }}
        restore-keys: |
          cocoapods-downloads-${{ runner.os }}-

    # No restore-keys: an installed Pods tree is only reusable for the exact
    # lockfile that produced it. pod install still runs on top of it.
    - name: Restore the installed Pods
      uses: actions/cache@v4
      with:
        path: ios/Pods
        key: pods-${{ runner.os }}-${{ hashFiles( 'ios/Podfile.lock', 'package-lock.json' ) }}

    - name: Update Pods
      run: cd ios && pod install

    # altool and xcodebuild both look for the key in ~/.appstoreconnect
    - name: Install the App Store Connect API key
      env:
        ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
      run: |
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        printf '%s' "$ASC_KEY_BASE64" | base64 --decode \
          > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

    # CFBundleVersion is a literal in the app's Info.plist but is generated from
    # CURRENT_PROJECT_VERSION for the share extension, so both need setting. A
    # UTC timestamp is unique and always increasing, so no bump gets committed.
    - name: Set the build number
      run: |
        BUILD_NUMBER="$( date -u +%Y.%m%d.%H%M%S )"
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" \
          ios/iNaturalistReactNative/Info.plist

    # -allowProvisioningUpdates lets xcodebuild create the distribution
    # certificate and App Store profiles with the API key, so no certificates
    # need to be exported from a Mac.
    #
    # COMPILER_INDEX_STORE_ENABLE=NO drops the index-while-building work, which
    # only feeds Xcode's editor; nothing opens this archive in an editor.
    - name: Archive
      run: |
        set -o pipefail
        ccache --zero-stats
        xcodebuild archive \
          -workspace ios/iNaturalistReactNative.xcworkspace \
          -scheme iNaturalistReactNative \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath "$ARCHIVE_PATH" \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
          COMPILER_INDEX_STORE_ENABLE=NO \
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
        {
          echo '### ccache'
          echo '```'
          ccache --show-stats
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Export the IPA
      run: |
        cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>app-store-connect</string>
          <key>destination</key>
          <string>export</string>
          <key>teamID</key>
          <string>$TEAM_ID</string>
          <key>signingStyle</key>
          <string>automatic</string>
          <key>uploadSymbols</key>
          <true/>
          <key>manageAppVersionAndBuildNumber</key>
          <false/>
        </dict>
        </plist>
        PLIST
        xcodebuild -exportArchive \
          -archivePath "$ARCHIVE_PATH" \
          -exportPath "$EXPORT_PATH" \
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" \
          -authenticationKeyID "$ASC_KEY_ID" \
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"

    - name: Upload to TestFlight
      run: |
        IPA="$( ls "$EXPORT_PATH"/*.ipa | head -1 )"
        xcrun altool --upload-app --type ios --file "$IPA" \
          --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
        echo "Uploaded build $BUILD_NUMBER to TestFlight" >> "$GITHUB_STEP_SUMMARY"

    - name: Store the IPA when something goes wrong
      uses: actions/upload-artifact@v6
      if: failure()
      with:
        name: ipa
        path: ${{ env.EXPORT_PATH }}
        retention-days: 5
        if-no-files-found: ignore
