##
# Runs appstore/make.sh, which makes the App Store screenshots and a preview
# of the listing in the iOS Simulator; see that script for what it pins. The
# build job makes the simulator app (it needs the repo's secrets and caches,
# like testflight-ios-build.yml); the appstore job runs the script on it and
# uploads appstore/build as the appstore artifact: framed/ holds the images
# for App Store Connect, preview.html the listing, debug/ Maestro's output.
#
# To rerun only the screenshots, say after changing a flow or a caption, pass
# app_run_id: a run whose simulator-app artifact to reuse. Nothing is signed
# or sent to App Store Connect; appstore/bin/listing.py upload does that.
##
name: App Store listing (iOS)
on:
  workflow_dispatch:
    inputs:
      app_run_id:
        description: Reuse the simulator-app artifact of this run instead of building.
        type: string
        default: ''
      runner:
        description: macOS runner image.
        type: string
        default: macos-26
  # Lets a branch iterate on the flow without first landing it on main
  push:
    branches: ['claude/**']
    paths:
      - .github/workflows/appstore-ios.yml
      - appstore/**

concurrency:
  group: appstore-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.app_run_id }}
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v6

    # The simulator app only changes with the app's own sources, so a run that
    # only changes appstore/ reuses the last build of them. Keyed on git's
    # hashes of those sources, worked out once: hashFiles() is evaluated
    # again when the cache saves, by when ios/ holds Pods and the build, and
    # it times out.
    - name: Key the simulator app on its sources
      id: key
      run: |
        echo "key=simulator-app-$( git ls-tree -r HEAD -- appstore/bin/build_simulator_app.sh \
          src ios assets index.js app.json babel.config.js metro.config.js \
          package-lock.json patches | shasum | cut -c1-40 )" >> "$GITHUB_OUTPUT"

    - name: Restore the simulator app
      id: app
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/app.zip
        key: ${{ steps.key.outputs.key }}

    - name: Check that every secret is present
      if: steps.app.outputs.cache-hit != 'true'
      env:
        DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
        GOOGLE_SERVICE_INFO_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PRODUCTION_BASE64 }}
      run: |
        missing=""
        for secret in DOTENV_BASE64 GOOGLE_SERVICE_INFO_PRODUCTION_BASE64; do
          [ -n "${!secret}" ] || missing="$missing $secret"
        done
        if [ -n "$missing" ]; then
          echo "Missing repository secrets:$missing" >&2
          exit 1
        fi

    - if: steps.app.outputs.cache-hit != 'true'
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'

    - name: Add Intel macOS to Gemfile.lock
      if: steps.app.outputs.cache-hit != 'true' && runner.arch == 'X64'
      run: bundle lock --add-platform x86_64-darwin

    - if: steps.app.outputs.cache-hit != 'true'
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    # Required workaround for Firebase & XCode >26.0.1
    - name: Set Xcode Toolchain
      if: steps.app.outputs.cache-hit != 'true'
      run: echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> "$GITHUB_ENV"

    # Same key as testflight-ios-build.yml, so the two share the cache
    - name: Restore node_modules and the installed Pods
      if: steps.app.outputs.cache-hit != 'true'
      id: deps
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          ios/Pods
        key: deps-${{ runner.arch == 'X64' && 'macOSX64' || runner.os }}-${{ hashFiles( '.nvmrc', 'package-lock.json', 'patches/**', 'ios/Podfile.lock' ) }}

    - name: Install Dependencies
      if: steps.app.outputs.cache-hit != 'true' && steps.deps.outputs.cache-hit != 'true'
      run: npm ci

    - name: Create .env file
      if: steps.app.outputs.cache-hit != 'true'
      env:
        DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
      run: |
        printf '%s' "$DOTENV_BASE64" | base64 --decode > .env
        # DOTENV_BASE64 predates the per-platform OAuth rename
        sed -i '' -e 's/\r$//' -e 's/^OAUTH_CLIENT_/IOS_OAUTH_CLIENT_/' .env

    - name: Create GoogleService-Info.production.plist
      if: steps.app.outputs.cache-hit != 'true'
      env:
        GOOGLE_SERVICE_INFO_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PRODUCTION_BASE64 }}
      run: |
        printf '%s' "$GOOGLE_SERVICE_INFO_PRODUCTION_BASE64" | base64 --decode \
          > ios/GoogleService-Info.production.plist

    - name: Download the cv model and taxonomy file into the ios folder
      if: steps.app.outputs.cache-hit != 'true'
      run: npm run add-example-model

    - name: Restore the CocoaPods download cache
      if: steps.app.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/CocoaPods
        key: cocoapods-downloads-${{ runner.os }}-${{ hashFiles( 'ios/Podfile.lock' ) }}
        restore-keys: |
          cocoapods-downloads-${{ runner.os }}-

    - name: Update Pods
      if: steps.app.outputs.cache-hit != 'true'
      run: cd ios && pod install

    - name: Build for the simulator
      if: steps.app.outputs.cache-hit != 'true'
      run: appstore/bin/build_simulator_app.sh "$RUNNER_TEMP/app.zip"

    - uses: actions/upload-artifact@v4
      with:
        name: simulator-app
        path: ${{ runner.temp }}/app.zip
        retention-days: 14

  appstore:
    needs: build
    # Runs after a build, or with no build when app_run_id is given
    if: ${{ !cancelled() && ( needs.build.result == 'success' || inputs.app_run_id ) }}
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v4
      with:
        name: simulator-app
        path: ${{ runner.temp }}/app
        run-id: ${{ inputs.app_run_id || github.run_id }}
        github-token: ${{ github.token }}

    - name: Unpack the app
      run: cd "$RUNNER_TEMP/app" && ditto -x -k app.zip .

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Maestro
      env:
        MAESTRO_VERSION: 1.41.0
      run: |
        curl -fsSL --retry 3 "https://get.maestro.mobile.dev" | bash
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

    - name: Make the listing
      run: |
        appstore/make.sh --app "$RUNNER_TEMP/app/iNaturalistReactNative.app" \
          --out "$RUNNER_TEMP/appstore"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: appstore
        include-hidden-files: true
        path: |
          ${{ runner.temp }}/appstore/framed
          ${{ runner.temp }}/appstore/raw
          ${{ runner.temp }}/appstore/debug
          ${{ runner.temp }}/appstore/preview.html
        retention-days: 30
