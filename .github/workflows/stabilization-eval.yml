# Runs the Video Stabilizer's FFT tile analysis (stabilization-eval/
# analyze_fft.m, built around the registration block cut straight out of
# VideoStabilizer.m) on the test clips, and commits the measurements to the
# branch. The clips aren't kept in the tree; they're read from the commit that
# added them. (analyze.m measured the earlier Vision analysis the same way.)
name: Stabilization eval

on:
  push:
    branches: [claude/stoic-curie-sovvo9]
    paths:
      - "stabilization-eval/analyze_fft.m"
      - "ios/iNaturalistReactNative/VideoStabilizer.m"
      - ".github/workflows/stabilization-eval.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          sed -n '/BEGIN FFT REGISTRATION/,/END FFT REGISTRATION/p' \
            ios/iNaturalistReactNative/VideoStabilizer.m > stabilization-eval/fft_block.inc
          clang -fobjc-arc -O2 -Wall -Wno-unused-function \
            -framework Foundation -framework AVFoundation -framework CoreImage \
            -framework CoreMedia -framework CoreVideo -framework CoreGraphics -framework Accelerate \
            -I stabilization-eval stabilization-eval/analyze_fft.m -o analyze_fft
      - name: Analyze
        run: |
          mkdir -p clips stabilization-eval/results
          for c in 3S1A8429 3S1A0091 3S1A1836; do
            git show "bb58d89:stabilization-eval/clips/$c.mov" > "clips/$c.mov"
            ./analyze_fft "clips/$c.mov" > "stabilization-eval/results/fft_$c.json"
          done
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stabilization-eval/results
          git diff --cached --quiet && exit 0
          git commit -m "Add FFT stabilization eval results from run ${{ github.run_id }}"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
