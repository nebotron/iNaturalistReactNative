# App Store screenshots, run by .github/workflows/screenshots-ios.yml on a
# freshly installed app. Walks the first-run onboarding, then the Explore tab,
# then up to two observations opened by deep link. Every step that only
# positions the app is optional, so a changed screen costs that one shot
# rather than the run; the workflow uploads Maestro's debug output alongside.
#
# Env (-e): APP_ID (bundle id of the build), OBS_ID_1 and OBS_ID_2
# (observation ids; empty skips the shot).
appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}

# Onboarding
- extendedWaitUntil:
    visible:
      id: Onboarding.welcome.next
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 01-welcome
- tapOn:
    id: Onboarding.welcome.next

- extendedWaitUntil:
    visible:
      id: Onboarding.obs_story.next
    timeout: 30000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 02-obs-story
- tapOn:
    id: Onboarding.obs_story.next
    optional: true

- extendedWaitUntil:
    visible:
      id: Onboarding.community_id.next
    timeout: 30000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 03-community-id
- tapOn:
    id: Onboarding.community_id.next
    optional: true

- extendedWaitUntil:
    visible:
      id: Onboarding.research_grade.next
    timeout: 30000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 04-research-grade
- tapOn:
    id: Onboarding.research_grade.next
    optional: true

- extendedWaitUntil:
    visible:
      id: Onboarding.impact.next
    timeout: 30000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05-impact
- tapOn:
    id: Onboarding.impact.next
    optional: true

# Skip sign-up: its close button opens a sheet whose EXIT leads to the
# location step
- extendedWaitUntil:
    visible:
      id: Onboarding.signup_email.close
    timeout: 30000
    optional: true
- tapOn:
    id: Onboarding.signup_email.close
    optional: true
- tapOn:
    text: EXIT
    optional: true

# Location was granted with simctl before launch, so no system prompt
- extendedWaitUntil:
    visible:
      id: Onboarding.location_explainer.next
    timeout: 30000
    optional: true
- tapOn:
    id: Onboarding.location_explainer.next
    optional: true
- runFlow:
    when:
      visible: Allow While Using App
    commands:
      - tapOn: Allow While Using App

# Main app
- extendedWaitUntil:
    visible:
      id: CustomTabBar
    timeout: 30000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 06-home

- tapOn:
    id: RootExplore
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 07-explore

- runFlow:
    when:
      true: ${OBS_ID_1 != ''}
    commands:
      - openLink: inaturalistmobile://www.inaturalist.org/observations/${OBS_ID_1}
      - waitForAnimationToEnd:
          timeout: 15000
      - takeScreenshot: 08-observation

- runFlow:
    when:
      true: ${OBS_ID_2 != ''}
    commands:
      - openLink: inaturalistmobile://www.inaturalist.org/observations/${OBS_ID_2}
      - waitForAnimationToEnd:
          timeout: 15000
      - takeScreenshot: 09-observation
